name: Daily store check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Shopify
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_API_VERSION: "2025-10"
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request

          shop = (os.environ.get("SHOPIFY_SHOP") or "").replace("https://", "").replace("http://", "").strip("/")
          token = os.environ.get("SHOPIFY_ACCESS_TOKEN") or ""
          client_id = os.environ.get("SHOPIFY_CLIENT_ID") or ""
          client_secret = os.environ.get("SHOPIFY_CLIENT_SECRET") or ""
          version = os.environ.get("SHOPIFY_API_VERSION", "2025-10")

          if not shop:
              raise SystemExit("Missing SHOPIFY_SHOP secret.")

          def read_error(err):
              body = ""
              if getattr(err, "fp", None):
                  try:
                      body = err.fp.read().decode("utf-8", "replace")
                  except Exception:
                      body = ""
              return f"{err} | {body}"

          if not token:
              if not client_id or not client_secret:
                  raise SystemExit("Need SHOPIFY_CLIENT_ID and SHOPIFY_CLIENT_SECRET (the shpss one).")
              data = urllib.parse.urlencode({
                  "grant_type": "client_credentials",
                  "client_id": client_id.strip(),
                  "client_secret": client_secret.strip(),
              }).encode()
              req = urllib.request.Request(
                  f"https://{shop}/admin/oauth/access_token",
                  data=data,
                  headers={"Content-Type": "application/x-www-form-urlencoded"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      payload = json.loads(resp.read().decode())
              except urllib.error.HTTPError as e:
                  raise SystemExit("Token exchange failed: " + read_error(e))
              token = payload.get("access_token") or ""
              if not token:
                  raise SystemExit(f"Token exchange returned no access_token: {payload}")
              print("Got a short-lived Admin token from client credentials.")

          query = {
            "query": """{
              shop { name currencyCode plan { displayName } }
              orders(first: 5, sortKey: CREATED_AT, reverse: true) {
                edges { node { name displayFinancialStatus displayFulfillmentStatus createdAt totalPriceSet { shopMoney { amount currencyCode } } } }
              }
            }"""
          }
          req = urllib.request.Request(
              f"https://{shop}/admin/api/{version}/graphql.json",
              data=json.dumps(query).encode(),
              headers={
                  "Content-Type": "application/json",
                  "X-Shopify-Access-Token": token,
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  payload = json.loads(resp.read().decode())
          except urllib.error.HTTPError as e:
              raise SystemExit("Shopify request failed: " + read_error(e))
          if payload.get("errors"):
              raise SystemExit(payload["errors"])
          data = payload.get("data") or {}
          shopinfo = data.get("shop") or {}
          print("STORE:", shopinfo.get("name"), shopinfo.get("currencyCode"))
          print("PLAN:", ((shopinfo.get("plan") or {}).get("displayName")))
          print("RECENT ORDERS:")
          edges = ((data.get("orders") or {}).get("edges") or [])
          if not edges:
              print("(none)")
          for edge in edges:
              n = edge["node"]
              money = ((n.get("totalPriceSet") or {}).get("shopMoney") or {})
              print(n.get("name"), n.get("displayFinancialStatus"), n.get("displayFulfillmentStatus"), money.get("amount"), money.get("currencyCode"))
          PY
